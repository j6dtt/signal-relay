# Which Signal groups go to which room, per subscriber. The same file on every low-side host.
#
# A room is a diode route: chat packets carry it in their CEF header (CEF:0|CHAT|<ROOM>|...), and the diode's own
# routes file sends each room to its receiver (in prod: one receiver, and one Gotham room, per room).
#
# Columns: subscriber (its ROUTES_FOR in docker-compose.yml), room, groups (comma-separated group IDs).
# A line starting with a space continues the groups of the line above. "#" starts a comment.
# Rooms: A-Z 0-9 - _ only (capitals), up to 32 characters. MONITOR is reserved (monitoring).
# A group may go to several rooms (it is sent once per room), but never twice to the same room: the subscriber
# refuses to start then, as it does on any other mistake here. Get group IDs with: signalctl cli -a NUM listGroups
# After editing: docker compose restart subscriber (each subscriber that has lines here).
#
# Group names (from listGroups), for reading this file:
#   zCV6AAXf…  Signal Relay
#   3Rr5QB/j…  Signal-API-SelfTest
#   not relayed: tEDNlYXe…, KL+jHLGB…, vJ3tw/ZL… (names not seen yet)

# subscriber         room       groups
signal-subscriber    RELAY      zCV6AAXf4WH28L62kT/iMZ4m6Mrck6ZIwiJhHupA5Ck=
signal-subscriber    SELFTEST   3Rr5QB/jXDXJ2XBmwu85/PBXcCueNoPIp/I0MxB4ARA=
