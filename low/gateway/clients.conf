# Who may connect to signal-cli's TLS gateway: one client per line, the name in its certificate
# (../image/tlscerts client NAME adds the line for you), then what it may use: events, check, rpc
# (comma-separated; nothing = all three). signal-cli reads this file again when it changes, so adding
# or removing a line needs no restart. To lock a client out, remove its line.
signal-subscriber
signal-subscriber-dtt
signal-monitor  check
