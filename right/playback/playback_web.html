<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Relay</title>
<style>
  /* Two views of the same stream: "chat" (bubbles) and "term" (terminal-style lines from chat_render.Chat).
     No external resources: works without internet. */
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2026; --muted: #6b7280; --line: #e3e5e9;
    --own: #2c6bed; --own-text: #ffffff; --bubble: #ffffff; --quote: rgba(0,0,0,.06);
    --ok: #1f9d55; --warn: #d97706; --bad: #dc2626;
    --n0:#c2410c; --n1:#15803d; --n2:#1d4ed8; --n3:#a21caf; --n4:#0e7490; --n5:#b45309;
    --n6:#be123c; --n7:#4d7c0f; --n8:#6d28d9; --n9:#0f766e; --n10:#9d174d; --n11:#1e40af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa1ab; --line: #2a2e35;
      --own: #2f5fd0; --own-text: #ffffff; --bubble: #23272e; --quote: rgba(255,255,255,.08);
      --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
      --n0:#fb923c; --n1:#4ade80; --n2:#60a5fa; --n3:#e879f9; --n4:#22d3ee; --n5:#fbbf24;
      --n6:#fb7185; --n7:#a3e635; --n8:#a78bfa; --n9:#2dd4bf; --n10:#f472b6; --n11:#93c5fd;
    }
  }
  /* terminal view always uses terminal colours, whatever the system theme */
  body.term {
    --bg: #0c0c0c; --panel: #1a1a1a; --text: #cccccc; --muted: #7f7f7f; --line: #2a2a2a;
    --ok: #23d18b; --warn: #e5c07b; --bad: #f14c4c;
  }
  :root {
    --c31: #cd3131; --c32: #0dbc79; --c33: #e5e510; --c34: #2472c8; --c35: #bc3fbc; --c36: #11a8cd;
    --c91: #f14c4c; --c92: #23d18b; --c93: #f5f543; --c94: #3b8eea; --c95: #d670d6; --c96: #29b8db;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; font: 15px/1.4 var(--sans); }
  body.term { font: 14px/1.45 var(--mono); }

  /* top bar */
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.term header { padding: 4px 16px; }
  body.term header h1 { font-size: 13px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle button { font: inherit; font-size: 12px; border: 0; padding: 4px 10px; cursor: pointer;
                   background: transparent; color: var(--muted); }
  .toggle button[aria-pressed="true"] { background: var(--own); color: var(--own-text); }
  body.term .toggle { border-radius: 0; }
  body.term .toggle button[aria-pressed="true"] { background: #333; color: #fff; }
  .stats { font-size: 12px; color: var(--muted); width: 100%; }
  .stats .warn { color: var(--warn); }

  /* tabs: "All" first, then one per group */
  #tabs { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 12px;
          display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
  .tab { font: inherit; font-size: 13px; border: 0; border-bottom: 2px solid transparent; background: transparent;
         color: var(--muted); padding: 6px 10px; cursor: pointer; white-space: nowrap; display: inline-flex;
         align-items: center; gap: 6px; }
  .tab .tn { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .tab.montab { order: 1; margin-left: auto; }     /* always the last tab, at the far right */
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--own); font-weight: 600; }
  .badge { background: var(--own); color: var(--own-text); border-radius: 999px; font-size: 11px; padding: 0 6px;
           font-weight: 600; }
  .badge:empty { display: none; }
  body.term .tab { font-size: 12px; padding: 4px 10px; }
  body.term .tab[aria-selected="true"] { border-bottom-color: var(--text); }
  body.term .badge { background: #333; color: #fff; border-radius: 0; }

  main { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  body.term main { padding: 8px 16px 16px; }
  .room { display: none; }
  .room.active { display: block; }
  .chatview, .termview { display: none; }
  body.chat .chatview { display: flex; }
  body.term .termview { display: block; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
  body.term .empty { text-align: left; margin-top: 0; }

  /* chat view */
  .chatview { max-width: 820px; margin: 0 auto; flex-direction: column; gap: 6px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel);
         border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 10px 0 4px; }
  .system { align-self: center; font-size: 13px; color: var(--muted); text-align: center; padding: 2px 8px; max-width: 90%; }
  .system.lost { color: var(--warn); }
  .msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 78%; }
  .msg.own { align-self: flex-end; align-items: flex-end; }
  .who { font-size: 12px; font-weight: 600; margin: 4px 10px 2px; }
  .who .grp, .meta .grp { color: var(--muted); font-weight: 400; }

  /* user + log out */
  .me { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 0; }
  .me button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--muted);
               border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  body.term .me button { border-radius: 0; }

  /* alert bell, next to "Live" on every tab: the parts that have a problem right now */
  .bell { position: relative; margin-left: 4px; }
  .bell > button { position: relative; display: inline-flex; align-items: center; justify-content: center;
                   width: 32px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
                   background: transparent; color: var(--text); cursor: pointer; }
  .bell > button[aria-expanded="true"] { background: var(--quote); }
  .bell svg { width: 18px; height: 18px; }
  .bbadge { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px;
           background: var(--warn); color: #fff; font: 700 11px/18px var(--sans); text-align: center; }
  .bbadge.bad { background: var(--bad); }
  .bbadge[hidden] { display: none; }
  .bell.ring svg { animation: ring .7s ease-in-out 2; transform-origin: 50% 12%; }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(15deg); } 40% { transform: rotate(-13deg); }
                    60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .bell.ring svg { animation: none; } }
  .bellpanel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: min(400px, calc(100vw - 32px));
               max-height: min(70vh, 520px); display: flex; flex-direction: column; background: var(--panel); color: var(--text);
               border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font: 13px/1.4 var(--sans); }
  .bellpanel[hidden] { display: none; }
  .bp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .bp-head { border-bottom: 1px solid var(--line); font-weight: 600; }
  .bp-list { overflow-y: auto; flex: 1; min-height: 0; }
  .al { display: grid; grid-template-columns: 8px 1fr; gap: 1px 10px; padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .al:first-child { border-top: 0; }
  .al:hover, .al:focus { background: var(--quote); outline: none; }
  .al .ad { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; grid-row: span 2; background: var(--muted); }
  .al .ad.warning { background: var(--warn); } .al .ad.error, .al .ad.critical { background: var(--bad); } .al .ad.ok { background: var(--ok); }
  .al .ad.unknown { background: var(--muted); }
  .al .ax { overflow-wrap: anywhere; }
  .al .at { font-size: 11px; color: var(--muted); }
  .bp-empty { padding: 18px 12px; text-align: center; color: var(--muted); }
  @media (max-width: 600px) { .bellpanel { position: fixed; left: 16px; right: 16px; top: 52px; width: auto; } }
  body.term .bell > button, body.term .bellpanel { border-radius: 0; }

  /* monitor tab */
  .tab .mdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .tab .mdot.warn { background: var(--warn); } .tab .mdot.bad { background: var(--bad); }
  #monview { display: none; max-width: 1100px; margin: 0 auto; font: 14px/1.4 var(--sans); }
  body.mon #monview { display: block; }
  body.mon .room, body.mon .toggle { display: none !important; }
  .mbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .mbar button, .mbar select { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
                               background: var(--panel); color: var(--text); padding: 3px 8px; cursor: pointer; }
  .mgroup { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok);
          border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .tile.warn, .tile.stale { border-left-color: var(--warn); }
  .tile.down { border-left-color: var(--bad); } .tile.unknown { border-left-color: var(--muted); }
  .tile .th { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .tile .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 7px; color: #fff; background: var(--ok); white-space: nowrap; }
  .st.warn, .st.stale { background: var(--warn); } .st.down { background: var(--bad); } .st.unknown { background: var(--muted); }
  .tile .tw { font-size: 12px; color: var(--muted); margin: 2px 0 4px; overflow-wrap: anywhere; }
  .tile dl { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; margin: 0; font-size: 12px; }
  .tile dt { color: var(--muted); } .tile dd { margin: 0; overflow-wrap: anywhere; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 6px; }
  .bars span { flex: 1; background: var(--ok); min-height: 2px; border-radius: 1px; opacity: .8; }
  .bars span.none { background: var(--line); } .bars span.some { background: var(--warn); } .bars span.many { background: var(--bad); }
  /* incidents: a period of trouble with its likely cause (rules in incidents.py, texts in runbook.json) */
  .inc { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px;
         padding: 8px 12px; margin-top: 6px; }
  .inc.bad { border-left-color: var(--bad); }
  .inc.closed { border-left-color: var(--line); padding: 5px 12px; }
  .inc .ih { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .inc .iw { font-size: 12px; color: var(--muted); }
  .inc .ic { font-weight: 600; }
  .inc p { margin: 4px 0; font-size: 13px; }
  .inc ul { margin: 4px 0; padding-left: 18px; font-size: 13px; }
  .inc .chk { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .inc .chk b { font-family: var(--sans); font-weight: 600; color: var(--muted); }
  .inc details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .bp-cause { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--quote); }
  .bp-cause .bk { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .bp-cause .bt { font-weight: 600; overflow-wrap: anywhere; }
  .evlog { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
  .ev { display: grid; grid-template-columns: 9.5em 5.5em 1fr; gap: 8px; padding: 5px 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .ev:first-child { border-top: 0; }
  .ev .et { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev .es { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .ev .es.warning { color: var(--warn); } .ev .es.error, .ev .es.critical { color: var(--bad); }
  .ev .ex { overflow-wrap: anywhere; }
  @media (max-width: 600px) { .ev { grid-template-columns: 1fr; gap: 0; } }
  .bubble { background: var(--bubble); border: 1px solid var(--line); border-radius: 16px; padding: 7px 11px;
            white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
  .own .bubble { background: var(--own); color: var(--own-text); border-color: transparent; }
  .quote { background: var(--quote); border-left: 3px solid currentColor; border-radius: 6px;
           padding: 4px 8px; margin-bottom: 5px; font-size: 13px; opacity: .9; }
  .quote .qn { font-weight: 600; display: block; }
  .quote .qt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .att { display: inline-block; font-size: 13px; border: 1px dashed currentColor; border-radius: 8px;
         padding: 2px 8px; margin: 2px 4px 2px 0; opacity: .85; }
  .meta { font-size: 11px; color: var(--muted); margin: 2px 10px 0; }
  .deleted .bubble { font-style: italic; opacity: .7; }
  .reacts { display: flex; gap: 4px; flex-wrap: wrap; margin: -4px 8px 0; position: relative; }
  .react { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 13px; }

  /* terminal view */
  .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ln .dim { color: var(--muted); }
  .ln .bold { font-weight: 700; }
  .c31 { color: var(--c31); } .c32 { color: var(--c32); } .c33 { color: var(--c33); }
  .c34 { color: var(--c34); } .c35 { color: var(--c35); } .c36 { color: var(--c36); }
  .c91 { color: var(--c91); } .c92 { color: var(--c92); } .c93 { color: var(--c93); }
  .c94 { color: var(--c94); } .c95 { color: var(--c95); } .c96 { color: var(--c96); }

  #jump { position: fixed; right: 16px; bottom: 16px; display: none; border: 0; border-radius: 999px;
          background: var(--own); color: var(--own-text); padding: 8px 14px; font: inherit; cursor: pointer;
          box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  body.term #jump { border-radius: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line);
                    padding: 4px 10px; font-size: 12px; box-shadow: none; }
</style>
</head>
<body class="term">
<header>
  <h1 id="title">All groups</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">Connecting…</span>
    <div class="bell" id="bell">
      <button type="button" aria-haspopup="true" aria-expanded="false" aria-controls="bellpanel" aria-label="Alerts" title="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bbadge" id="badge" hidden></span>
      </button>
      <div class="bellpanel" id="bellpanel" role="dialog" aria-label="Alerts" hidden>
        <div class="bp-head"><span>Open alerts</span></div>
        <div class="bp-list" id="alerts"></div>
      </div>
    </div>
  </div>
  <form class="me" method="post" action="/logout"><span id="me"></span><button type="submit">Log out</button></form>
  <div class="toggle" role="group" aria-label="View">
    <button data-view="chat" aria-pressed="false">Chat</button><button data-view="term" aria-pressed="true">Terminal</button>
  </div>
  <div class="stats"><span id="roomstatus"></span> · <span id="stats">no receiver counters yet</span></div>
</header>
<nav id="tabs" role="tablist" aria-label="Groups"></nav>
<main id="scroller">
  <section id="monview">
    <div class="mbar"><b style="color:var(--text)">Incidents</b><span>likely causes, from fixed rules</span></div>
    <div id="incidents"></div>
    <div id="tiles"></div>
    <div class="mbar" style="margin-top:18px">
      <b style="color:var(--text)">Events</b>
      <select id="evfilter" aria-label="Show"><option value="all">all</option><option value="warning">warnings and errors</option>
        <option value="error">errors only</option></select>
    </div>
    <div class="evlog" id="evlog"></div>
  </section>
</main>
<button id="jump">New messages ↓</button>
<script>
const scroller = document.getElementById("scroller"), jump = document.getElementById("jump");
const tabsEl = document.getElementById("tabs");
const ALL = "all", MON = "monitor";   // MON: the Monitor tab (not a chat room)
const rooms = new Map();      // room id ("all" or a group ID) -> {id, name, count, last, seen, el, chatEl, termEl, nodes, lastDay, tab}
let active = ALL;
let wanted = null;            // a tab asked for (link or remembered) that hasn't had a message yet since playback started

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
                                 if (text != null) e.textContent = text; return e; };   // textContent only: text is untrusted
// all times in UTC, the same clock as the terminal view
const fmtTime = ts => new Date(ts).toLocaleTimeString([], {timeZone: "UTC", hourCycle: "h23", hour: "2-digit", minute: "2-digit"});
const fmtDay = ts => new Date(ts).toLocaleDateString([], {timeZone: "UTC", weekday: "long", year: "numeric", month: "short", day: "numeric"}) + " (UTC)";
const atBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; jump.style.display = "none"; };
const clearEmpty = parent => parent.querySelector(".empty")?.remove();
const isTerm = () => document.body.classList.contains("term");
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const recall = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
let baseTitle = document.title;               // the tab's title; drawBell() puts the unread count in front
function setTitle(t) { baseTitle = t; drawBell(); }

// ---- view switch: terminal by default, the last choice remembered per browser ----
function setView(v) {
  document.body.className = v + (active === MON ? " mon" : "");
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  jump.textContent = v === "term" ? "new messages ↓" : "New messages ↓";
  store("view", v);
  toBottom();
}
document.querySelectorAll(".toggle button").forEach(b => b.onclick = () => setView(b.dataset.view));
{ const v = recall("view"); if (v === "term" || v === "chat") setView(v); }

// ---- tabs: "All" (the default) first, then one per group, in the order first seen ----
// A link to one group: https://…:8090/#g=<first 8 characters of its ID>. The last tab is remembered per browser.
const hashWanted = () => { if (location.hash === "#monitor") return MON;
                           const m = location.hash.match(/^#g=(.+)$/); return m ? decodeURIComponent(m[1]) : null; };
const matches = (room, w) => w && (w === ALL ? room.id === ALL : room.id !== ALL && room.id.startsWith(w));

function emptyNote(room) {
  return [el("div", "empty", room.id === ALL ? "Waiting for messages…" : "No messages since playback started."),
          el("div", "empty", room.id === ALL ? "waiting for messages…" : "no messages since playback started")];
}
function ensureRoom(info) {
  let room = rooms.get(info.id);
  if (!room) {
    room = {id: info.id, name: info.name, count: 0, last: null, seen: 0, nodes: new Map(), lastDay: null,
            el: el("section", "room"), chatEl: el("div", "chatview"), termEl: el("div", "termview"),
            tab: el("button", "tab")};
    const [ce, te] = emptyNote(room);
    room.chatEl.append(ce); room.termEl.append(te);
    room.el.append(room.chatEl, room.termEl); scroller.append(room.el);
    room.tab.setAttribute("role", "tab");
    room.tab.append(el("span", "tn"), el("span", "badge"));
    room.tab.onclick = () => { wanted = null; select(room.id); };
    if (room.id === ALL) tabsEl.prepend(room.tab); else tabsEl.append(room.tab);
    rooms.set(room.id, room);
    if (wanted && matches(room, wanted)) { wanted = null; select(room.id); }
  }
  room.name = info.name; room.count = info.count; room.last = info.last;
  if (room.id === active) room.seen = room.count;
  drawTab(room);
  if (room.id === active) drawStatus();
  return room;
}
function drawTab(room) {
  room.tab.querySelector(".tn").textContent = room.id === ALL ? "All" : room.name;
  room.tab.title = room.id === ALL ? "Every group, plus lost-message notices" : room.name;
  const unread = room.id === active ? 0 : room.count - room.seen;
  room.tab.querySelector(".badge").textContent = unread > 0 ? (unread > 99 ? "99+" : unread) : "";
  room.tab.setAttribute("aria-selected", room.id === active);
}
function select(id) {
  if (id === MON) {
    active = MON;
    for (const r of rooms.values()) { r.el.classList.remove("active"); drawTab(r); }
    monTab.setAttribute("aria-selected", true);
    document.body.classList.add("mon");
    document.getElementById("title").textContent = "Monitor";
    setTitle("Signal Relay · Monitor");
    store("tab", MON);
    if (location.hash !== "#monitor") history.replaceState(null, "", location.pathname + location.search + "#monitor");
    renderMon(); drawStatus(); scroller.scrollTop = 0; jump.style.display = "none";
    return;
  }
  const room = rooms.get(id) || rooms.get(ALL);
  if (!room) return;
  active = room.id;
  monTab.setAttribute("aria-selected", false);
  document.body.classList.remove("mon");
  for (const r of rooms.values()) { r.el.classList.toggle("active", r.id === active); drawTab(r); }
  room.seen = room.count; drawTab(room);
  const title = active === ALL ? "All groups" : room.name;
  document.getElementById("title").textContent = title;
  setTitle("Signal Relay · " + title);
  store("tab", active === ALL ? ALL : active.slice(0, 8));
  const hash = active === ALL ? "" : "#g=" + encodeURIComponent(active.slice(0, 8));
  if (location.hash !== hash) history.replaceState(null, "", location.pathname + location.search + hash);
  drawStatus(); toBottom();
}
window.addEventListener("hashchange", () => {
  const w = hashWanted() || ALL, room = [...rooms.values()].find(r => matches(r, w));
  if (w === MON) { wanted = null; select(MON); }
  else if (room) { wanted = null; select(room.id); } else { select(ALL); wanted = w; }   // shown when that group talks
});

// the tab's own status: how many messages and how long since the last one (a quiet group stands out)
function ago(ms) {
  const m = Math.floor((Date.now() - ms) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 48 * 60 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} days ago`;
}
function drawStatus() {
  const st = document.getElementById("roomstatus");
  if (active === MON) {
    const n = {}; for (const p of mon.parts) n[p.state] = (n[p.state] || 0) + 1;
    const bad = mon.parts.length - (n.up || 0);
    st.textContent = `${mon.parts.length} parts · ${n.up || 0} up` + (bad ? ` · ${bad} with problems` : " · all well");
    return;
  }
  const room = rooms.get(active);
  if (!room) return;
  const what = room.id === ALL ? `${rooms.size - 1} group${rooms.size === 2 ? "" : "s"}, ` : "";
  st.textContent = room.last == null ? what + "no messages since playback started"
    : `${what}${room.count} message${room.count === 1 ? "" : "s"} · last ${fmtTime(room.last)} UTC (${ago(room.last)})`;
}
setInterval(drawStatus, 30000);

// ---- chat view ----
function bubble(item, showGroup) {
  if (item.type === "system") return el("div", "system" + (item.text.startsWith("A message was lost") ? " lost" : ""), item.text);
  const box = el("div", "msg" + (item.own ? " own" : "") + (item.deleted ? " deleted" : ""));
  if (!item.own) {
    const who = el("div", "who", item.name); who.style.color = `var(--n${item.color})`;
    if (showGroup && item.group) who.append(el("span", "grp", " · " + item.group));
    box.append(who);
  }
  const b = el("div", "bubble");
  if (item.deleted) b.textContent = "This message was deleted.";
  else {
    if (item.quote) { const q = el("div", "quote"); q.append(el("span", "qn", item.quote.name), el("span", "qt", item.quote.text || "[attachment]")); b.append(q); }
    if (item.sticker) b.append(el("span", "att", "sticker"));
    for (const a of item.attachments) b.append(el("span", "att", "📎 " + a));
    if (item.text) b.append(document.createTextNode(((item.attachments.length || item.sticker) ? "\n" : "") + item.text));
    if (!item.text && !item.attachments.length && !item.sticker && !item.quote) b.textContent = "(empty or unsupported message)";
  }
  box.append(b);
  const counts = {};
  for (const r of Object.values(item.reactions || {})) (counts[r.emoji] ||= []).push(r.name);
  if (Object.keys(counts).length) {
    const rs = el("div", "reacts");
    for (const [emoji, names] of Object.entries(counts)) {
      const r = el("span", "react", names.length > 1 ? `${emoji} ${names.length}` : emoji); r.title = names.join(", "); rs.append(r);
    }
    box.append(rs);
  }
  const meta = el("div", "meta", fmtTime(item.ts) + (item.edited && !item.deleted ? " · edited" : ""));
  if (showGroup && item.own && item.group) meta.prepend(el("span", "grp", item.group + " · "));
  box.append(meta);
  return box;
}
function addItem(room, item) {
  clearEmpty(room.chatEl);
  const day = fmtDay(item.ts);
  if (day !== room.lastDay) { room.chatEl.append(el("div", "day", day)); room.lastDay = day; }
  const node = bubble(item, room.id === ALL); room.nodes.set(item.id, node); room.chatEl.append(node);
}

// ---- terminal view ----
function termLine(segs) {
  const div = el("div", "ln");
  for (const s of segs) div.append(el("span", s.k || null, s.t));
  return div;
}

// ---- Monitor tab: one tile per part of the relay, the diode link per left host, and the event timeline ----
let mon = {parts: [], links: {}, events: [], incidents: [], runbook: null, now: 0}, skew = 0;      // skew: this browser's clock minus the server's
const monTab = el("button", "tab montab");
monTab.setAttribute("role", "tab");
monTab.append(el("span", "mdot"), el("span", "tn", "Monitor"));
monTab.title = "The state of every part of the relay";
monTab.onclick = () => { wanted = null; select(MON); };
tabsEl.append(monTab);
const monEl = document.getElementById("monview");
const STATE = {up: "UP", warn: "WARN", stale: "STALE", unknown: "UNKNOWN", down: "DOWN"};
const INFO = {stream: "stream", last_event_age_s: "last event", sent: "sent", ignored: "ignored", queue: "queue",
  errors: "errors", warnings: "warnings", cert_days: "certificate", check_ms: "check", up_s: "up for",
  disk_free_pct: "disk free", messages: "messages", packets: "packets", lost: "lost", missing_packets: "packets missing",
  bad: "bad packets", duplicates: "duplicates", stream_code: "why", started: "started", ver: "version", parts: "reports on",
  passed: "passed on", not_delivered: "not delivered"};
const dur = s => s == null ? "–" : s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min`
  : s < 172800 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 86400)} days`;
const fmtWhen = ts => new Date(ts).toISOString().slice(0, 19).replace("T", " ");
function infoValue(k, v) {
  if (v == null || v === "") return null;
  if (k.endsWith("_s")) return k === "last_event_age_s" ? dur(v) + " ago" : dur(v);
  if (k === "cert_days") return `${v} days left`;
  if (k === "disk_free_pct") return `${v}%`;
  if (k === "check_ms") return `${v} ms`;
  if (k === "started") return fmtWhen(v) + " UTC";
  return typeof v === "number" ? v.toLocaleString() : String(v);
}
function setMon(m) {
  mon.parts = m.parts || []; mon.links = m.links || {}; mon.now = m.now || Date.now(); mon.incidents = m.incidents || [];
  skew = Date.now() - mon.now;
  const worst = mon.parts.some(p => p.state === "down" || p.state === "unknown") ? "bad"
    : mon.parts.some(p => p.state === "warn" || p.state === "stale") ? "warn" : "";
  monTab.querySelector(".mdot").className = "mdot " + worst;
}
function tile(title, state, sub, rows, extra) {
  const t = el("div", "tile " + state), h = el("div", "th");
  h.append(el("span", "tn", title), el("span", "st " + state, STATE[state] || state.toUpperCase()));
  t.append(h);
  if (sub) t.append(el("div", "tw", sub));
  const dl = el("dl");
  for (const [k, v] of rows) { dl.append(el("dt", null, k), el("dd", null, v)); }
  t.append(dl);
  if (extra) t.append(extra);
  return t;
}
function partTile(p) {
  const age = (Date.now() - skew - p.last) / 1000;
  const name = p.comp === "subscriber" ? `subscriber ${p.name}` : p.comp;
  const sub = (p.comp === "playback" ? "this page's server" : `last heard ${dur(age)} ago`) + (p.text ? ` · ${p.text}` : "");
  const rows = [];
  for (const [k, v] of Object.entries(p.info || {})) { const f = infoValue(k, v); if (f != null) rows.push([INFO[k] || k, f]); }
  return tile(name, p.state, sub, rows.slice(0, 8));
}
function linkTile(host) {
  const l = mon.links[host];
  if (!l) return null;
  // silence first: the loss rate only measures packets that arrived, so it can't see a link carrying nothing
  const quiet = l.last_ms ? (Date.now() - skew - l.last_ms) / 1000 : null;
  const state = quiet == null ? "unknown" : quiet > 180 ? "down" : quiet > 90 ? "stale"
    : l.loss_1h == null ? "unknown" : l.loss_1h < 1 ? "up" : l.loss_1h < 5 ? "warn" : "down";
  const bars = el("div", "bars");
  for (const v of l.hours) {
    const b = el("span", v == null ? "none" : v >= 5 ? "many" : v > 0 ? "some" : null);
    b.style.height = v == null ? "2px" : `${Math.max(8, Math.min(100, 8 + v * 9))}%`;
    b.title = v == null ? "no data" : `${v}% lost`;
    bars.append(b);
  }
  const sub = quiet > 90 ? `no monitoring packets for ${dur(quiet)}` : "monitoring packets from this host, last 24 h (one bar per hour)";
  return tile("diode link", state, sub,
    [["last packet", quiet == null ? "–" : `${dur(quiet)} ago`], ["lost (1 h)", l.loss_1h == null ? "–" : `${l.loss_1h}%`], ["delay (1 h)", l.delay_ms == null ? "–" : l.delay_ms < 1000 ? `${l.delay_ms} ms` : `${(l.delay_ms / 1000).toFixed(1)} s`],
     ["packets (1 h)", (l.packets_1h || 0).toLocaleString()]], bars);
}
function renderMon() {
  const box = document.getElementById("tiles");
  box.replaceChildren();
  const group = (label, tiles) => {
    if (!tiles.length) return;
    const g = el("div", "tiles"); tiles.forEach(t => t && g.append(t));
    box.append(el("div", "mgroup", label), g);
  };
  const right = mon.parts.filter(p => p.side === "right");
  group("Right side", right.map(partTile));
  const hosts = [...new Set(mon.parts.filter(p => p.side === "left").map(p => p.host))].sort();
  for (const host of hosts) {
    const mine = mon.parts.filter(p => p.side === "left" && p.host === host);
    group(`Left host ${host}`, [...mine.filter(p => p.comp === "signal-monitor").map(partTile), linkTile(host)]);
    for (const inst of [...new Set(mine.filter(p => p.inst).map(p => p.inst))].sort()) {
      const parts = mine.filter(p => p.inst === inst).sort((a, b) => (a.comp === "signal-cli" ? -1 : 1) - (b.comp === "signal-cli" ? -1 : 1) || a.name.localeCompare(b.name));
      group(`Instance ${inst} (on ${host})`, parts.map(partTile));
    }
  }
  if (!hosts.length) box.append(el("div", "mgroup", "No left host has reported yet (signal-monitor → diode → monitor-receiver)."));
  renderIncidents();
  renderEvents();
}
const where = scope => scope === "right" ? "right side" : scope.replace(/^left\//, "");
function renderIncidents() {
  const box = document.getElementById("incidents"), now = Date.now() - skew;
  const open = mon.incidents.filter(i => !i.closed), closed = mon.incidents.filter(i => i.closed);
  const rows = open.map(i => {
    const down = i.parts.some(k => mon.parts.some(p => p.key === k && (p.state === "down" || p.state === "unknown")));
    const d = el("div", "inc" + (down ? " bad" : "")), h = el("div", "ih");
    h.append(el("span", "ic", `#${i.id} ${where(i.scope)}: ${i.cause.title}`),
      el("span", "iw", `open for ${dur((now - i.opened) / 1000)} · since ${fmtWhen(i.opened)} UTC`));
    d.append(h);
    if (i.cause.evidence.length) { const ul = el("ul"); i.cause.evidence.forEach(t => ul.append(el("li", null, t))); d.append(ul); }
    const rb = (mon.runbook || {})[i.cause.code];
    if (rb) {
      d.append(el("p", null, rb.explain));
      const det = el("details"), ul = el("ul");
      det.append(el("summary", null, "What to check"));
      for (const c of rb.checks) { const li = el("li", "chk"); if (c.where) li.append(el("b", null, c.where + ": ")); li.append(c.do); ul.append(li); }
      det.append(ul); det.open = true; d.append(det);
    }
    if (i.also.length) d.append(el("p", "iw", "Also: " + i.also.map(a => a.title).join("; ")));
    return d;
  });
  const past = closed.slice(0, 5).map(i => {
    const d = el("div", "inc closed"), h = el("div", "ih");
    h.append(el("span", null, `#${i.id} ${where(i.scope)}: ${i.cause.title}`),
      el("span", "iw", `${fmtWhen(i.opened)} UTC, lasted ${dur((i.closed - i.opened) / 1000)}`));
    d.append(h); return d;
  });
  box.replaceChildren(...(rows.length ? rows : [el("div", "inc closed", "No open incident.")]), ...past);
}
function loadRunbook() {
  fetch("/api/monitor/runbook", {cache: "no-store"}).then(r => r.ok ? r.json() : null)
    .then(rb => { if (rb) { mon.runbook = rb; if (active === MON) renderIncidents(); } }).catch(() => {});
}
function renderEvents() {
  const f = document.getElementById("evfilter").value, log = document.getElementById("evlog");
  const keep = {all: () => true, warning: e => e.sev !== "info", error: e => e.sev === "error" || e.sev === "critical"}[f];
  const rows = mon.events.filter(keep).slice(-300).reverse().map(e => {
    const r = el("div", "ev");
    r.append(el("span", "et", fmtWhen(e.at)), el("span", "es " + e.sev, e.sev), el("span", "ex", e.text));
    return r;
  });
  log.replaceChildren(...(rows.length ? rows : [el("div", "ev", "No events.")]));
}
document.getElementById("evfilter").onchange = renderEvents;
setInterval(() => { if (active === MON) renderMon(); }, 5000);           // keep "last heard" ages current

// ---- alert bell (next to "Live", every tab): the parts that have a problem right now ----
// Not a second event log: a part leaves the list as soon as it is UP again. Worst first, then the oldest problem.
const bell = document.getElementById("bell"), bellBtn = bell.querySelector("button"), badge = document.getElementById("badge");
const panel = document.getElementById("bellpanel"), alertsEl = document.getElementById("alerts");
const RANK = {down: 0, unknown: 1, stale: 2, warn: 3};
let openIssues = null;                        // part keys with a problem at the last draw (null: first draw, don't ring)
const issues = () => mon.parts.filter(p => p.state in RANK).sort((a, b) => RANK[a.state] - RANK[b.state] || a.since - b.since);
function issueText(p) {
  // the event that recorded this state says why; else build it from the part
  const ev = [...mon.events].reverse().find(e => e.part === p.key && e.at >= p.since - 5000 && e.text.includes(` is ${STATE[p.state]}`));
  if (ev) return ev.text;
  const where = p.inst ? ` (${p.inst} on ${p.host})` : p.host ? ` (on ${p.host})` : "";
  return `${p.comp === "subscriber" ? "subscriber " + p.name : p.comp}${where} is ${STATE[p.state]}` + (p.text ? `: ${p.text}` : ".");
}
function drawBell() {
  const list = issues(), n = list.length, label = n > 99 ? "99+" : String(n);
  badge.hidden = !n; badge.textContent = label;
  badge.className = "bbadge" + (list.some(p => p.state === "down" || p.state === "unknown") ? " bad" : "");
  bellBtn.setAttribute("aria-label", n ? `Alerts: ${label} open` : "Alerts: none");
  document.title = (n ? `(${label}) ` : "") + baseTitle;
  const keys = new Set(list.map(p => p.key));
  if (openIssues && [...keys].some(k => !openIssues.has(k))) {          // a new problem: ring once
    bell.classList.remove("ring"); void bell.offsetWidth; bell.classList.add("ring");
  }
  openIssues = keys;
  if (!panel.hidden) drawAlerts();
}
function drawAlerts() {
  const rows = issues().map(p => {
    const r = el("div", "al");
    r.tabIndex = 0;
    r.append(el("span", "ad " + (p.state === "down" ? "error" : p.state === "unknown" ? "unknown" : "warning")),
      el("span", "ax", issueText(p)),
      el("span", "at", `since ${dur((Date.now() - skew - p.since) / 1000)} ago · ${fmtWhen(p.since)} UTC`));
    r.onclick = openMonitor;
    r.onkeydown = k => { if (k.key === "Enter") openMonitor(); };
    return r;
  });
  const causes = mon.incidents.filter(i => !i.closed).map(i => {
    const c = el("div", "bp-cause");
    c.append(el("div", "bk", `Likely cause · ${where(i.scope)}`), el("div", "bt", i.cause.title));
    c.onclick = openMonitor;
    return c;
  });
  alertsEl.replaceChildren(...causes, ...(rows.length ? rows : [el("div", "bp-empty", "No open alerts: every part is UP.")]));
}
function openPanel(open) {
  panel.hidden = !open;
  bellBtn.setAttribute("aria-expanded", open);
  if (open) {
    // phone width: the list spans the screen, just below the (wrapped) header
    panel.style.top = matchMedia("(max-width: 600px)").matches ? `${document.querySelector("header").getBoundingClientRect().bottom + 4}px` : "";
    drawAlerts(); alertsEl.scrollTop = 0;
  }
}
function openMonitor() { openPanel(false); wanted = null; select(MON); }
bellBtn.onclick = () => openPanel(panel.hidden);
document.addEventListener("click", e => { if (!panel.hidden && !bell.contains(e.target)) openPanel(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) { openPanel(false); bellBtn.focus(); } });
setInterval(() => { if (!panel.hidden) drawAlerts(); }, 30000);         // keep "since" ages current

// ---- stream ----
function apply(op) {
  if (op.op === "stats") return showStats(op.stats);
  if (op.op === "snapshot") {
    for (const r of rooms.values()) { r.el.remove(); r.tab.remove(); }
    rooms.clear();
    const keep = wanted || active;
    wanted = null;
    for (const info of op.rooms) {
      const room = ensureRoom(info);
      room.seen = room.count;                   // history isn't "unread"
      if (info.lines.length) room.termEl.replaceChildren(...info.lines.map(termLine));
      info.items.forEach(item => addItem(room, item));
    }
    document.getElementById("me").textContent = op.user || "";
    if (op.mon) { setMon(op.mon); mon.events = op.mon.events || []; drawBell(); }
    if (keep === MON) return select(MON);
    const room = [...rooms.values()].find(r => matches(r, keep) || r.id === keep);
    if (!room && keep !== ALL) wanted = keep;   // its group hasn't talked yet: switch when it does
    return select(room ? room.id : ALL);
  }
  if (op.op === "room") return ensureRoom(op.room);
  if (op.op === "mon") { setMon(op); drawBell(); if (active === MON) { renderMon(); drawStatus(); } return; }
  if (op.op === "mon_event") {
    mon.events.push(op.event); if (mon.events.length > 300) mon.events.shift();
    if (active === MON) renderEvents();
    if (!panel.hidden) drawAlerts();
    return;
  }
  const room = rooms.get(op.room);
  if (!room) return;
  const here = room.id === active, stick = here && atBottom();
  let grew = false;
  if (op.op === "line") { clearEmpty(room.termEl); room.termEl.append(termLine(op.segs)); grew = here && isTerm(); }
  if (op.op === "add") { addItem(room, op.item); grew = here && !isTerm(); }
  if (op.op === "update") {
    const old = room.nodes.get(op.item.id);
    if (old) { const n = bubble(op.item, room.id === ALL); old.replaceWith(n); room.nodes.set(op.item.id, n); }
  }
  if (stick) toBottom(); else if (grew) jump.style.display = "block";
}
function showStats(s) {
  const st = document.getElementById("stats");
  st.textContent = `receiver: ${s.messages} messages from ${s.packets} packets · `;
  const bad = s.lost + s.missing_packets + s.bad, tail = el("span", bad ? "warn" : null,
    bad ? `${s.lost} lost, ${s.missing_packets} packets missing, ${s.bad} bad` : "nothing lost");
  st.append(tail);
  if (s.duplicates) st.append(` · ${s.duplicates} duplicates ignored`);
}
scroller.addEventListener("scroll", () => { if (atBottom()) jump.style.display = "none"; });
jump.onclick = toBottom;

// first tab: a link (#g=…) wins, then the one this browser had last, else "All"
wanted = hashWanted() || recall("tab") || ALL;

let delay = 1000;
function connect() {
  const dot = document.getElementById("dot"), conn = document.getElementById("conn");
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { dot.classList.add("on"); conn.textContent = "Live"; delay = 1000; if (!mon.runbook) loadRunbook(); };
  ws.onmessage = e => apply(JSON.parse(e.data));
  ws.onclose = e => {
    if (e.code === 4001) return location.assign("/login");                     // logged out, expired or removed
    dot.classList.remove("on"); conn.textContent = "Disconnected, retrying…";
    fetch("/api/monitor/state", {cache: "no-store"}).then(r => { if (r.status === 401) location.assign("/login"); }).catch(() => {});
    setTimeout(connect, delay); delay = Math.min(delay * 2, 15000);
  };
}
connect();
</script>
</body>
</html>
