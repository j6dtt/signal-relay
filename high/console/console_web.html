<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Chat Relay Console</title>
<style>
  /* Two views of the same stream: "chat" (bubbles) and "term" (terminal-style lines from chat_render.Chat).
     No external resources: works without internet. */
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2026; --muted: #6b7280; --line: #e3e5e9;
    --own: #2c6bed; --own-text: #ffffff; --bubble: #ffffff; --quote: rgba(0,0,0,.06);
    --ok: #1f9d55; --warn: #d97706; --bad: #dc2626;
    --n0:#c2410c; --n1:#15803d; --n2:#1d4ed8; --n3:#a21caf; --n4:#0e7490; --n5:#b45309;
    --n6:#be123c; --n7:#4d7c0f; --n8:#6d28d9; --n9:#0f766e; --n10:#9d174d; --n11:#1e40af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa1ab; --line: #2a2e35;
      --own: #2f5fd0; --own-text: #ffffff; --bubble: #23272e; --quote: rgba(255,255,255,.08);
      --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
      --n0:#fb923c; --n1:#4ade80; --n2:#60a5fa; --n3:#e879f9; --n4:#22d3ee; --n5:#fbbf24;
      --n6:#fb7185; --n7:#a3e635; --n8:#a78bfa; --n9:#2dd4bf; --n10:#f472b6; --n11:#93c5fd;
    }
  }
  /* terminal view always uses terminal colours, whatever the system theme */
  body.term {
    --bg: #0c0c0c; --panel: #1a1a1a; --text: #cccccc; --muted: #7f7f7f; --line: #2a2a2a;
    --ok: #23d18b; --warn: #e5c07b; --bad: #f14c4c;
  }
  :root {
    --c31: #cd3131; --c32: #0dbc79; --c33: #e5e510; --c34: #2472c8; --c35: #bc3fbc; --c36: #11a8cd;
    --c91: #f14c4c; --c92: #23d18b; --c93: #f5f543; --c94: #3b8eea; --c95: #d670d6; --c96: #29b8db;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; font: 15px/1.4 var(--sans); }
  body.term { font: 14px/1.45 var(--mono); }

  /* top bar */
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.term header { padding: 4px 16px; }
  body.term header h1 { font-size: 13px; font-weight: 600; }
  /* the title, in the diagram's colours: low side green, through the diode's magenta, to the high side's red; a
     mark of three dots runs the same way, like a message crossing the diode (still if the viewer asks for less motion) */
  header h1.brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; letter-spacing: .05em;
                    filter: drop-shadow(0 0 8px color-mix(in srgb, #d946ef 35%, transparent)); }
  body.term header h1.brand { font-size: 19px; font-weight: 800; }
  .brand .btext { background: linear-gradient(90deg, #22c55e, #d946ef 50%, #ef4444, #d946ef, #22c55e); background-size: 300% 100%;
                  -webkit-background-clip: text; background-clip: text; color: transparent; animation: brandflow 12s linear infinite;
                  overflow: hidden; text-overflow: ellipsis; }
  .brand .bmark { display: inline-flex; gap: 3px; flex-shrink: 0; }
  .brand .bmark i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: brandhop 2.4s ease-in-out infinite; }
  .brand .bmark i:nth-child(2) { background: #d946ef; animation-delay: .3s; } .brand .bmark i:nth-child(3) { background: #ef4444; animation-delay: .6s; }
  @keyframes brandflow { to { background-position: 300% 0; } }
  @keyframes brandhop { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .brand .btext, .brand .bmark i { animation: none; } .brand .bmark i { opacity: 1; } }
  @media (max-width: 640px) { header h1.brand, body.term header h1.brand { flex: 1 0 100%; font-size: 17px; } }   /* phone: its own line */
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle button { font: inherit; font-size: 12px; border: 0; padding: 4px 10px; cursor: pointer;
                   background: transparent; color: var(--muted); }
  .toggle button[aria-pressed="true"] { background: var(--own); color: var(--own-text); }
  body.term .toggle { border-radius: 0; }
  body.term .toggle button[aria-pressed="true"] { background: #333; color: #fff; }
  .stats { font-size: 12px; color: var(--muted); width: 100%; }
  /* the top bar's KPIs (user, 2026-10-20): what is checked, how much is OK, the problems (worst first), the messages */
  .kpis { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .kpi { display: flex; flex-direction: column; justify-content: center; min-width: 74px; padding: 4px 12px 5px;
         border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px; background: var(--bg); }
  .kpi b { font-size: 18px; line-height: 1.15; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .kpi.ok { border-left-color: var(--ok); } .kpi.ok b { color: var(--ok); }
  .kpi.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--bg)); } .kpi.warn b { color: var(--warn); }
  .kpi.down { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--bg)); } .kpi.down b { color: var(--bad); }
  .kpi.wide { min-width: 0; flex: 0 1 auto; max-width: 420px; } .kpi.wide span { white-space: normal; }
  button.kpi { font: inherit; text-align: left; cursor: pointer; color: inherit; } button.kpi:hover { filter: brightness(1.15); }
  .kpi .kbar { height: 3px; margin-top: 3px; border-radius: 2px; background: color-mix(in srgb, var(--bad) 55%, transparent); overflow: hidden; }
  .kpi .kbar i { display: block; height: 100%; background: var(--ok); }
  body.term .kpi { border-radius: 0; }
  .stats .warn { color: var(--warn); }

  /* unread counts (the dock's chips) */
  .badge { background: var(--own); color: var(--own-text); border-radius: 999px; font-size: 11px; padding: 0 6px;
           font-weight: 600; }
  .badge:empty { display: none; }
  body.term .badge { background: #333; color: #fff; border-radius: 0; }

  main { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  body.term main { padding: 8px 16px 16px; }
  .room { display: none; }
  .room.active { display: block; }
  .chatview, .termview { display: none; }
  body.chat .chatview { display: flex; }
  body.term .termview { display: block; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
  body.term .empty { text-align: left; margin-top: 0; }

  /* chat view */
  .chatview { max-width: 820px; margin: 0 auto; flex-direction: column; gap: 6px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel);
         border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 10px 0 4px; }
  .system { align-self: center; font-size: 13px; color: var(--muted); text-align: center; padding: 2px 8px; max-width: 90%; }
  .system.lost { color: var(--warn); }
  .msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 78%; }
  .msg.own { align-self: flex-end; align-items: flex-end; }
  .who { font-size: 12px; font-weight: 600; margin: 4px 10px 2px; }
  .who .grp, .meta .grp { color: var(--muted); font-weight: 400; }

  /* user + log out */
  .me { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 0; }
  .me button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--muted);
               border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  body.term .me button { border-radius: 0; }

  /* alert bell, next to "Live" on every tab: the parts that have a problem right now */
  .bell { position: relative; margin-left: 4px; }
  .bell > button { position: relative; display: inline-flex; align-items: center; justify-content: center;
                   width: 32px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
                   background: transparent; color: var(--text); cursor: pointer; }
  .bell > button[aria-expanded="true"] { background: var(--quote); }
  /* "Ask Analyst": right of the bell, opens the Analyst window (questions about the relay as a whole) */
  .askopen { height: 30px; margin-left: 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap;
             background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .askopen[aria-expanded="true"] { background: var(--quote); }
  .askopen.aibad::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%;
                          background: var(--bad); vertical-align: middle; }
  body.term .askopen { border-radius: 0; }
  body:not(.mon) .askopen, body:not(.mon) .askwin { display: none !important; }   /* Monitor tab only */
  .bell svg { width: 18px; height: 18px; }
  .bbadge { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px;
           background: var(--warn); color: #fff; font: 700 11px/18px var(--sans); text-align: center; }
  .bbadge.bad { background: var(--bad); }
  .bbadge[hidden] { display: none; }
  .bell.ring svg { animation: ring .7s ease-in-out 2; transform-origin: 50% 12%; }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(15deg); } 40% { transform: rotate(-13deg); }
                    60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .bell.ring svg { animation: none; } }
  .bellpanel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: min(400px, calc(100vw - 32px));
               max-height: min(70vh, 520px); display: flex; flex-direction: column; background: var(--panel); color: var(--text);
               border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font: 13px/1.4 var(--sans); }
  .bellpanel[hidden] { display: none; }
  .bp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .bp-head { border-bottom: 1px solid var(--line); font-weight: 600; }
  .bp-list { overflow-y: auto; flex: 1; min-height: 0; }
  .al { display: grid; grid-template-columns: 8px 1fr; gap: 1px 10px; padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .al:first-child { border-top: 0; }
  .al:hover, .al:focus { background: var(--quote); outline: none; }
  .al .ad { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; grid-row: span 2; background: var(--muted); }
  .al .ad.warning { background: var(--warn); } .al .ad.error, .al .ad.critical { background: var(--bad); } .al .ad.ok { background: var(--ok); }
  .al .ad.unknown { background: var(--muted); }
  .al .ax { overflow-wrap: anywhere; }
  .al .at { font-size: 11px; color: var(--muted); }
  .bp-empty { padding: 18px 12px; text-align: center; color: var(--muted); }
  .bp-foot { font: inherit; font-size: 13px; text-align: left; padding: 8px 12px; border: 0; border-top: 1px solid var(--line);
             background: transparent; color: var(--text); cursor: pointer; border-radius: 0 0 10px 10px; }
  .bp-foot:hover, .bp-foot:focus { background: var(--quote); outline: none; }
  body.term .bp-foot { border-radius: 0; }
  @media (max-width: 600px) { .bellpanel { position: fixed; left: 16px; right: 16px; top: 52px; width: auto; } }
  body.term .bell > button, body.term .bellpanel { border-radius: 0; }

  /* the Monitor diagram: the page */
  #monview { display: none; max-width: 1900px; margin: 0 auto; font: 14px/1.4 var(--sans); }
  body.mon #monview { display: block; }
  .chatwin .room { display: block; }               /* a group's messages live in its window */
  /* group windows: one per Signal group (+ All), opened from the dock, a room on the diagram, or a pulsing wire */
  .chatwin .cw-figs { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
                      display: flex; flex-direction: column; gap: 3px; }
  .chatwin .cw-figs .rt { color: var(--text); } .chatwin .cw-figs .rt.up b { color: var(--ok); }
  .chatwin .cw-figs .rt.warn b { color: var(--warn); } .chatwin .cw-figs .rt.unknown b { color: var(--muted); }
  .chatwin .cw-figs .rt.down b, .chatwin .cw-figs .lostl { color: var(--bad); } .chatwin .cw-figs .rt.idle b { color: var(--muted); }
  .chatwin .cw-body { overflow-y: auto; padding: 8px 12px; font-size: 13px; line-height: 1.4; }   /* smaller than the page */
  body.term .chatwin .cw-body { font-size: 12px; }
  .chatwin .quote, .chatwin .att, .chatwin .react, .chatwin .system { font-size: 11.5px; }
  .chatwin .bubble { padding: 5px 9px; }

  #dock { display: flex; gap: 6px; align-items: center; padding: 6px 12px; background: var(--panel);
          border-top: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; }
  #dock .dk-label { font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .chip { font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
          border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: none; color: var(--text); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--quote); }
  .chip .cd { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip .cd.up { background: var(--ok); } .chip .cd.down { background: var(--bad); } .chip .cd.warn { background: var(--warn); }
  .chip .badge:empty { display: none; }
  body.term .chip { border-radius: 0; }
  .popmenu { position: fixed; z-index: 3000; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 6px 24px rgba(0,0,0,.35); padding: 4px; display: flex; flex-direction: column; min-width: 200px; }
  .popmenu[hidden] { display: none; }
  .popmenu .ph { font-size: 11px; color: var(--muted); padding: 4px 8px; }
  .popmenu .pr { font-size: 12px; font-weight: 600; padding: 6px 8px 2px; border-top: 1px solid var(--line); }
  .popmenu button.sub { padding-left: 18px; }
  .tile .roomsb { font-size: 11px; white-space: nowrap; margin-right: 6px; padding: 0 6px; }
  .popmenu button { font: inherit; font-size: 13px; text-align: left; background: none; border: 0; color: var(--text);
                    padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .popmenu button:hover { background: var(--quote); }
  body.term .popmenu, body.term .popmenu button { border-radius: 0; }
  .wire-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
  .wire-hit.tip { cursor: help; }
  .pulse { fill: var(--ok); filter: drop-shadow(0 0 4px var(--ok)); }
  svg.pulses { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 15; overflow: visible; }   /* over the diagram, under the bell panel and windows */
  #roomstatus.stuck { color: var(--bad); font-weight: 600; }
  .mgroup { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  /* Monitor tab: a live diagram. One grid: low side (2 columns) | the diode | high side (2 columns); the tiles are
     its boxes, an SVG layer draws the wires (coloured by state), backgrounds mark the sides and the diode band */
  .dg-wrap { position: relative; overflow: hidden; margin-top: 8px; }
  .dg { position: relative; display: grid; grid-template-columns: 255px 255px 220px 255px 255px; column-gap: 44px;
        row-gap: 22px; width: max-content; padding: 14px 18px 22px; transform-origin: 0 0; align-items: start; }
  .dg > .tile, .dg-stack > .tile, .dg > .dg-legend { position: relative; z-index: 3; }
  .dg-stack { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 3; }
  .dg-bg { border-radius: 12px; margin: -12px -16px -14px; z-index: 0; align-self: stretch; }
  /* light green low side, light red high side, light magenta diode (tints, so they work in light and dark mode) */
  .dg-bg.low { background: color-mix(in srgb, #22c55e 6%, transparent); border: 1px solid color-mix(in srgb, #22c55e 30%, transparent); }
  .dg-bg.high { background: color-mix(in srgb, #ef4444 5%, transparent); border: 1px solid color-mix(in srgb, #ef4444 30%, transparent); }
  .dg-bg.diode { margin: -12px -14px -14px; background: color-mix(in srgb, #d946ef 7%, transparent);
                 border: 1px solid color-mix(in srgb, #d946ef 25%, transparent); }
  .dg-head.diode { color: #c026d3; }
  /* (the boxes' ≡ log buttons were removed 2026-10-19; .logb still styles the rooms button) */
  .tile .logb { font: inherit; font-size: 13px; line-height: 1; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
                background: transparent; color: var(--muted); cursor: pointer; margin-left: 4px; }
  .tile .logb:hover { color: var(--text); background: var(--quote); }
  body.term .tile .logb { border-radius: 0; }
  /* the timeline under the diagram: one lane per box, 24 h, coloured by its state; dots = warnings and errors */
  .tl-box { margin: 18px 0 8px; }
  .tl-head { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
  .tl-head b { font-size: 14px; } .tl-head span { color: var(--muted); font-size: 12px; }
  .tl-lane { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 8px; height: 18px; margin-top: 3px; cursor: pointer; }
  .tl-lane:hover .tl-name { color: var(--text); }
  .tl-name { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .tl-bar { position: relative; display: flex; height: 12px; border-radius: 3px; overflow: visible; background: var(--quote); }
  .tl-bar > i { flex: 1; height: 100%; }
  .tl-bar > i.up { background: color-mix(in srgb, var(--ok) 70%, transparent); } .tl-bar > i.warn, .tl-bar > i.stale { background: var(--warn); }
  .tl-bar > i.down { background: var(--bad); } .tl-bar > i.unknown { background: var(--muted); opacity: .6; }
  .tl-dot { position: absolute; top: -3px; width: 7px; height: 18px; margin-left: -3px; border-radius: 3px; border: 2px solid var(--bg); }
  .tl-dot.warning { background: var(--warn); } .tl-dot.error, .tl-dot.critical { background: var(--bad); }
  .tl-axis { display: grid; grid-template-columns: 170px 1fr; gap: 8px; margin-top: 4px; font-size: 10.5px; color: var(--muted); }
  .tl-axis > div { position: relative; height: 14px; } .tl-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  /* the Log window (a timeline lane, or the Monitoring marker): every monitoring event, filtered */
  .logwin .lf { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .logwin .lf select, .logwin .lf input { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px;
                                          background: var(--panel); color: var(--text); min-width: 0; }
  .logwin .lf input { flex: 1 1 140px; }
  .logwin .ev { grid-template-columns: 8.5em 5em 1fr; font-size: 12.5px; }
  .logwin .lmore { margin-top: 8px; }
  .dg-head { position: relative; z-index: 3; font-size: 15px; font-weight: 700; align-self: end; }
  .dg-head span { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .dg-host { position: relative; z-index: 3; font-size: 12px; font-weight: 600; color: var(--muted); }
  /* compact boxes (user, 2026-10-20): a healthy box is one line; a box with a problem opens by itself; ▸/▾ by hand */
  .tile .th { cursor: pointer; } .tile .th .tn { flex: 1; text-align: left; } .tile .tog { color: var(--muted); font-weight: 400; margin-right: 4px; flex: none; }
  .tile.compact > .tw, .tile.compact > dl { display: none; }
  .tile .tk { display: none; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .tile.compact .tk { display: block; } .tile.compact .tk .roomsb { margin-right: 6px; }
  .dg-boxes { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  .dg-boxes button { font: inherit; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; cursor: pointer; }
  .dg-boxes button:hover, .dg-boxes button.on { color: var(--text); background: var(--quote); }
  /* the page's own tooltip (user, 2026-10-20: not the browser's white box); click it to pin, Escape closes */
  .tipbox { position: fixed; z-index: 1000; max-width: 380px; background: var(--panel); color: var(--text);
            border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.45;
            box-shadow: 0 6px 24px rgba(0,0,0,.35); white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: auto; }
  .tipbox .tt { font-weight: 600; } .tipbox .tl { color: var(--muted); }
  .tipbox .s-up { color: var(--ok); font-weight: 600; } .tipbox .s-warn, .tipbox .s-stale { color: var(--warn); font-weight: 600; }

<script>
const ALL = "all", MON = "monitor";   // MON: the Monitor page, the main page (the only one since 2026-10-19)
const rooms = new Map();      // room id ("all" or a group ID) -> {id, name, count, last, seen, el, chatEl, termEl, nodes, lastDay, win}
const active = MON;           // the page always shows the Monitor diagram; each group has its own window
let wanted = null;            // a group window asked for (link #g=…) whose group hasn't had a message yet

    yes.textContent = ok; yes.className = danger ? "danger" : ""; no.hidden = !cancel; no.textContent = cancel || "";
    const end = v => { modal.close(); done(v); };

let floatTop = 40;                                               // the window used last is on top
function floating(win, head, key, def) {
  const raise = () => { win.style.zIndex = ++floatTop; };
  win.addEventListener("pointerdown", raise);
  const rect = () => { const b = win.getBoundingClientRect(); return {x: b.left, y: b.top, w: b.width, h: b.height}; };
  const place = r => {
    const W = innerWidth, H = innerHeight, w = Math.min(r.w, W - 16), h = Math.min(r.h, H - 16);
    Object.assign(win.style, {width: w + "px", height: h + "px",
      left: Math.max(8, Math.min(r.x, W - w - 8)) + "px", top: Math.max(8, Math.min(r.y, H - h - 8)) + "px"});
  };
  const save = () => { if (!win.hidden) store(key, JSON.stringify(rect())); };
  head.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button")) return;
    const start = rect(), x0 = e.clientX, y0 = e.clientY;
    head.setPointerCapture(e.pointerId);
    const move = m => place({...start, x: start.x + m.clientX - x0, y: start.y + m.clientY - y0});

    show() {

}

  for (const i of mon.incidents) if (i.parts.includes(key)) keys.add(`incident/${i.id}`);
  return keys;
}
function fillParts(sel) {
  const opts = [["all", "all parts"], ["incident", "incidents"], ["container", "containers"]];
  for (const p of mon.parts) opts.push([p.key, `${partLabel(p)}${p.host ? " · " + p.host : ""}`]);
  for (const h of Object.keys(mon.links)) opts.push([`link/${h}`, `diode link · ${h}`]);
  lwPart.replaceChildren(...opts.map(([v, t]) => { const o = el("option", null, t); o.value = v; return o; }));
  lwPart.value = opts.some(o => o[0] === sel) ? sel : "all";
}
function openLog(key = "all") {
  openPanel(false);
  fillParts(key);
  const p = mon.parts.find(x => x.key === key);
  document.getElementById("lwTitle").textContent = key === "all" ? "Log" : `Log · ${p ? partLabel(p) : lwPart.selectedOptions[0]?.textContent || key}`;
  logWin.show();
  renderEvents();
}
function closeLog() { logWin.hide(); }
function renderEvents() {                                 // the Log window's list (kept up to date while it is open)
  if (logwin.hidden) return;
  const v = lwPart.value, f = document.getElementById("lwLevel").value, q = document.getElementById("lwText").value.trim().toLowerCase();
  const sev = {all: () => true, warning: e => e.sev !== "info", error: e => e.sev === "error" || e.sev === "critical"}[f];
  const keys = v === "all" || v === "incident" || v === "container" ? null : relatedKeys(v);
  const cat = v === "all" ? () => true : v === "incident" ? k => k.startsWith("incident/") : v === "container" ? k => k.includes("/container/")
            : k => keys.has(k);
  const seen = new Set(), all = [...older, ...mon.events].filter(e => !seen.has(e.id) && seen.add(e.id));
  const rows = all.filter(e => sev(e) && cat(e.part) && (!q || e.text.toLowerCase().includes(q))).reverse().slice(0, 500).map(e => {
    const inc = e.part.startsWith("incident/") ? Number(e.part.slice(9)) : null;
    const r = el("div", "ev"), x = el("span", "ex");
    if (inc) {                                    // a visible chip, like the tiles', opens the incident
      const chip = el("button", "incchip", `#${inc} ›`); chip.type = "button"; chip.title = "Open this incident";
      chip.onclick = () => openIncident(inc); x.append(chip);
    }
    const tc = testChip(e); if (tc) x.append(tc);
    x.append(e.text);
    r.append(el("span", "et", fmtWhen(e.at)), el("span", "es " + e.sev, e.sev), x);
    return r;
  });
  document.getElementById("lwList").replaceChildren(...(rows.length ? rows : [el("div", "ev", "No events.")]));
  document.getElementById("lwMore").hidden = noOlder;
  renderRemove(v);
}
// "Remove this box", in the Log window of a box that has gone quiet: for a container or receiver that no longer
// exists. Only after REMOVE_AFTER (the console checks the same); a host's signal-monitor or diode link takes the host.
const REMOVE_AFTER = 3600;
function renderRemove(v) {
  const box = document.getElementById("lwRemove"), btn = document.getElementById("lwRmBtn"), why = document.getElementById("lwRmWhy");
  const host = v.startsWith("link/") ? v.slice(5) : /^low\/[^/]+\/signal-monitor$/.test(v) ? v.split("/")[1] : null;
  const p = mon.parts.find(x => x.key === (host ? `low/${host}/signal-monitor` : v));
  box.hidden = !p || v === "high/console" || p.state === "up";     // nothing to offer for a healthy box
  if (box.hidden) return;
  const quiet = (Date.now() - skew - p.last) / 1000, n = host ? mon.parts.filter(x => x.side === "low" && x.host === host).length : 1;
  btn.textContent = host ? `Remove host ${host} (${n} boxes)` : "Remove this box";
  btn.disabled = quiet < REMOVE_AFTER;
  why.textContent = btn.disabled ? `For a box that no longer exists. Possible once nothing has been heard from it for 1 h `
    + `(last heard ${dur(quiet)} ago).` : "It no longer reports. Its history stays; it comes back by itself if it reports again.";
  btn.onclick = async () => {
    const what = host ? `host ${host} and its ${n} boxes` : partLabel(p) + (p.host ? ` on ${p.host}` : "");
    if (!await confirmBox("Remove from the diagram?", `Remove ${what} from the Monitor tab, for everyone. Its log and `
        + "timeline history stay. If it reports again, it comes back by itself.", "Remove")) return;
    const r = await fetch("/api/monitor/forget", {method: "POST", headers: {"Content-Type": "application/json"},
                                                    body: JSON.stringify({key: v})}).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (!r || !r.ok) return noticeBox("Not removed", d.error || "The console could not be reached. Try again.");
    lwPart.value = "all"; lwPart.onchange();
  };
}
document.getElementById("lwMore").onclick = () => {
  const first = [...older, ...mon.events].reduce((m, e) => Math.min(m, e.id || Infinity), Infinity);
  fetch(`/api/monitor/events?limit=300&before=${first === Infinity ? 0 : first}`, {cache: "no-store"}).then(r => r.json())
    .then(d => { older = [...d.events, ...older]; noOlder = d.events.length < 300; renderEvents(); }).catch(() => {});
};
lwPart.onchange = () => { const p = mon.parts.find(x => x.key === lwPart.value);
  document.getElementById("lwTitle").textContent = lwPart.value === "all" ? "Log" : `Log · ${p ? partLabel(p) : lwPart.selectedOptions[0].textContent}`; renderEvents(); };
document.getElementById("lwLevel").onchange = renderEvents;
document.getElementById("lwText").oninput = renderEvents;
document.getElementById("lwClose").onclick = closeLog;

// ---- the timeline under the diagram: each box's state over 24 h (10-minute columns), events as dots ----
let tlData = null, tlAt = 0;
function loadTimeline() {
  fetch("/api/monitor/timeline?hours=24", {cache: "no-store"}).then(r => r.ok ? r.json() : null)
    .then(d => { if (d) { tlData = d; tlAt = Date.now(); renderTimeline(); } }).catch(() => {});
}
function timelineKeys() {                 // the diagram's order: low side (per host), the diode link, then the high side
  const keys = [], hosts = [...new Set(mon.parts.filter(p => p.side === "low").map(p => p.host))].sort();
  const order = c => ({"signal-servers": 0, "signal-cli": 1, subscriber: 2, "signal-monitor": 3}[c] ?? 4);
  for (const h of hosts) {
    mon.parts.filter(p => p.side === "low" && p.host === h).sort((a, b) => order(a.comp) - order(b.comp) || a.key.localeCompare(b.key))
      .forEach(p => keys.push(p.key));
    keys.push(`link/${h}`);
  }
  mon.parts.filter(p => p.comp === "receiver").sort((a, b) => a.name.localeCompare(b.name)).forEach(p => keys.push(p.key));
  for (const c of ["monitor-receiver", "console"]) if (mon.parts.some(p => p.key === `high/${c}`)) keys.push(`high/${c}`);
  return keys;
}
function renderTimeline() {
  const box = document.getElementById("timeline");
  if (!tlData) { box.replaceChildren(el("div", "dw-when", "Loading the timeline…")); return; }
  const {start, end} = tlData, span = end - start, head = el("div", "tl-head");
  head.append(el("b", null, "Last 24 hours"), el("span", null, "each box's state, 10-minute columns; dots: warnings and errors. Click a lane for its log."));
  const lanes = timelineKeys().map(k => {
    const p = mon.parts.find(x => x.key === k), lane = el("div", "tl-lane"), bar = el("div", "tl-bar");
    const name = k.startsWith("link/") ? `diode link · ${k.slice(5)}` : `${partLabel(p)}${p.host ? " · " + p.host : ""}`;   // partLabel names a 2nd signal-cli
    lane.append(el("div", "tl-name", name));
    for (const st of tlData.lanes[k] || []) bar.append(el("i", st || null));
    if (!(tlData.lanes[k] || []).length) bar.title = "no figures recorded yet";
    const keys = relatedKeys(k);
    for (const e of [...older, ...mon.events]) {
      if (e.sev === "info" || !keys.has(e.part) || e.at < start) continue;
      const dot = el("span", "tl-dot " + e.sev); dot.style.left = `${Math.min(100, (e.at - start) / span * 100)}%`;
      dot.title = `${fmtWhen(e.at).slice(11, 16)} UTC · ${e.text}`; bar.append(dot);
    }
    lane.append(bar);
    lane.onclick = () => openLog(k);
    return lane;
  });
  const axis = el("div", "tl-axis"), ticks = el("div");
  for (let h = 0; h <= 24; h += 3) {
    const t = el("span", null, h === 24 ? "now" : fmtWhen(start + h * 3600_000).slice(11, 16));
    t.style.left = `${h / 24 * 100}%`; ticks.append(t);
  }
  axis.append(el("div"), ticks);
  box.replaceChildren(head, ...lanes, axis);
}
setInterval(() => { if (active === MON && Date.now() - tlAt > 60_000) loadTimeline(); }, 10_000);
setInterval(() => { if (active === MON) renderMon(); }, 5000);
let monResize = null;                    // the diagram's wires follow the tiles: redraw when the window changes size
addEventListener("resize", () => { clearTimeout(monResize); monResize = setTimeout(() => { if (active === MON) renderMon(); }, 150); });           // keep "last heard" ages current

// ---- bell (next to "Live", every tab): the open incidents, one row each; a row opens the drawer ----
const bell = document.getElementById("bell"), bellBtn = bell.querySelector("button"), badge = document.getElementById("badge");
const panel = document.getElementById("bellpanel"), alertsEl = document.getElementById("alerts");
let seenIncidents = null;                     // open incident ids at the last draw (null: first draw, don't ring)
function drawBell() {
  const open = bellIncidents().sort((a, b) => (worst(a) === "error" ? 0 : 1) - (worst(b) === "error" ? 0 : 1) || a.opened - b.opened);
  const n = open.length, label = n > 99 ? "99+" : String(n);
  badge.hidden = !n; badge.textContent = label;
  badge.className = "bbadge" + (open.some(i => worst(i) === "error") ? " bad" : "");
  bellBtn.setAttribute("aria-label", n ? `Incidents: ${label} to look at` : "Incidents: none open");
  document.title = (n ? `(${label}) ` : "") + baseTitle;
  const ids = new Set(open.map(i => i.id));
  if (seenIncidents && [...ids].some(id => !seenIncidents.has(id))) {     // a new incident: ring once
    bell.classList.remove("ring"); void bell.offsetWidth; bell.classList.add("ring");
  }
  seenIncidents = ids;
  open.forEach(i => loadAi(i.id));
  if (!panel.hidden) drawAlerts();
}
function drawAlerts() {
  const now = Date.now() - skew;
  const rows = bellIncidents().map(i => {
    const r = el("div", "al"), a = explainOf(i.id);
    r.tabIndex = 0;
    const parts = i.parts.map(k => allParts().find(p => p.key === k)).filter(p => p && p.state !== "up")
      .map(p => `${p.comp === "subscriber" || p.comp === "connection" ? partLabel(p) : p.comp} ${STATE[p.state] || p.state}`);
    const lost = (i.loss || []).reduce((n, x) => n + (x.n || 0), 0);
    const ax = el("span", "ax", `${where(i.scope)} · ${i.cause.title} · ${i.closed ? "closed, not opened yet" : dur((now - i.opened) / 1000)}`);
    const tc = testChip(i); if (tc) ax.prepend(tc);
    r.append(el("span", "ad " + worst(i)), ax,
      el("span", "ah2", a && a.card && a.card.headline && a.rules_code === i.cause.code ? `Analyst: ${a.card.headline}`
        : [lost ? `${lost} lost` : "", ...parts].filter(Boolean).join(" · ") || (i.closed ? "all well again" : "recovering…")));
    r.onclick = () => openIncident(i.id);
    r.onkeydown = k => { if (k.key === "Enter") openIncident(i.id); };
    return r;
  });
  alertsEl.replaceChildren(...(rows.length ? rows : [el("div", "bp-empty", "No open incident.")]));
}
function openPanel(open) {
  panel.hidden = !open;
  bellBtn.setAttribute("aria-expanded", open);
  if (open) {
    // phone width: the list spans the screen, just below the (wrapped) header
    panel.style.top = matchMedia("(max-width: 600px)").matches ? `${document.querySelector("header").getBoundingClientRect().bottom + 4}px` : "";
    drawAlerts(); alertsEl.scrollTop = 0;
  }
}
bellBtn.onclick = () => openPanel(panel.hidden);
document.addEventListener("click", e => { if (!panel.hidden && !bell.contains(e.target)) openPanel(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.open && !panel.hidden) { openPanel(false); bellBtn.focus(); } });
setInterval(() => { if (!panel.hidden) drawAlerts(); }, 30000);         // keep "since" ages current

// ---- stream ----
function apply(op) {
  if (op.op === "stats") return showStats(op.stats);
  if (op.op === "snapshot") {
    const reopen = openIds();                 // the windows open before (this browser), opened again
    for (const r of rooms.values()) r.win.el.remove();
    rooms.clear();
    chatView = op.chat_view !== false; chatShort = op.chat_text === "short" ? op.short_words || 5 : 0;
    document.getElementById("me").textContent = op.user || "";
    mon.assist = !!op.assist; mon.host = op.host || "";
    if (op.mon) { mon.alive = Date.now(); setMon(op.mon); mon.events = op.mon.events || []; drawBell(); }
    for (const info of op.rooms) {
      const room = ensureRoom(info);
      room.seen = room.count;                   // history isn't "unread"
      if (info.lines.length) room.termEl.replaceChildren(...info.lines.map(termLine));
      info.items.forEach(item => addItem(room, item));
    }
    addFigureOnlyRooms();
    for (const r of rooms.values()) if (reopen.some(w => matches(r, w))) openChat(r.id);
    const w = hashWanted();
    if (w) { const r = [...rooms.values()].find(x => matches(x, w)); if (r) openChat(r.id); else wanted = w; }
    renderMon(); drawStatus(); drawDock();
    return;
  }
  if (op.op === "room") return ensureRoom(op.room);
  if (op.op === "ai") return addAi(op.entry.incident, op.entry);
  if (op.op === "ai_wait" || op.op === "ai_done") {                     // the Analyst is busy with (or done with) something
    const id = op.kind === "howto" ? HOWTO : op.incident == null ? GEN : op.incident,
          k = op.kind === "ask" || op.kind === "howto" ? "ask:" + id : op.kind === "wrapup" ? "wrap:" + id : id;
    if (op.op === "ai_wait") { if (!asking.has(k)) asking.set(k, Date.now()); } else asking.delete(k);
    redrawAi(id);
    return drawBell();
  }
  if (op.op === "ai_clear") return clearAsks(op.kind === "howto" ? HOWTO : op.incident == null ? GEN : op.incident);   // someone pressed Clear          // a new AI answer (asked by someone, or by itself)
  if (op.op === "mon_alive") { mon.alive = Date.now(); if (active === MON) drawStatus(); return; }
  if (op.op === "mon") { mon.alive = Date.now(); setMon(op); drawBell(); renderMon(); drawStatus(); addFigureOnlyRooms();
                        for (const r of rooms.values()) drawFigs(r); drawDock();
                        if (drawerId != null && Date.now() - drawerAt > 3000) refreshDrawer(); return; }
  if (op.op === "mon_event") {
    mon.events.push(op.event); if (mon.events.length > 300) mon.events.shift();
    if (active === MON) renderEvents();
    if (!panel.hidden) drawAlerts();
    return;
  }
  const room = rooms.get(op.room);
  if (!room) return;
  const box = room.win.el.hidden ? null : room.win.body;           // a window at its bottom follows new lines
  const stick = box && box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (op.op === "line") { clearEmpty(room.termEl); room.termEl.append(termLine(op.segs)); if (room.id !== ALL) pulse(room.id); }
  if (op.op === "add") addItem(room, op.item);
  if (op.op === "update") {
    const old = room.nodes.get(op.item.id);
    if (old) { const n = bubble(op.item, room.id === ALL); old.replaceWith(n); room.nodes.set(op.item.id, n); }
  }
  if (stick) box.scrollTop = box.scrollHeight;
}
// groups the console counts but shows no text for (CHAT_VIEW=off, or not seen since it started): a window with
// their figures, so every group the subscribers send is in the dock
function addFigureOnlyRooms() {
  if (!rooms.has(ALL)) return;
  for (const [gid, g] of Object.entries(mon.groups || {}))
    if (!rooms.has(gid) && (g.routes.length || !chatView)) ensureRoom({id: gid, name: g.name, count: 0, last: null});
  // before a group's first message the console knows it only by its ID's first 8 characters (no name yet), so its
  // window is named that; once the full ID has a window, the placeholder goes
  for (const [id, room] of [...rooms])
    if (id !== ALL && id.length <= 8 && !(mon.groups || {})[id] && [...rooms.keys()].some(k => k !== id && k.startsWith(id))) {
      room.win.el.remove(); rooms.delete(id); drawDock(); rememberOpen();
    }
}
let rxTotals = null;                       // every receiver's counters added up (receivers' boxes have their own)
function showStats(s) { rxTotals = s; }
document.body.classList.add("mon");
setTitle("Signal Chat Relay Console");

let delay = 1000;
function connect() {
  const dot = document.getElementById("dot"), conn = document.getElementById("conn");
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { dot.classList.add("on"); conn.textContent = "Live"; delay = 1000; };
  ws.onmessage = e => apply(JSON.parse(e.data));
  ws.onclose = e => {
    if (e.code === 4001) return location.assign("/login");                     // logged out, expired or removed
    dot.classList.remove("on"); conn.textContent = "Disconnected, retrying…";
    fetch("/api/monitor/state", {cache: "no-store"}).then(r => { if (r.status === 401) location.assign("/login"); }).catch(() => {});
    setTimeout(connect, delay); delay = Math.min(delay * 2, 15000);
  };
}
connect();

// ---- the page's own tooltip (user, 2026-10-20): every title and wire, in the page's colours. Hover shows it after a
// moment; moving onto it keeps it; clicking it pins it (Escape or a click elsewhere closes); keyboard focus shows it
// too; on a phone, a long press shows it pinned. Text only (textContent), like everything else here.
const tipBox = el("div", "tipbox"); tipBox.hidden = true; tipBox.setAttribute("role", "tooltip");
document.body.append(tipBox);
let tipFor = null, tipShow = null, tipHide = null, tipPinned = false, tipPress = null;
const tipTarget = n => n && n.closest ? n.closest("[title],[data-tip]") : null;
function tipOf(e) { if (e.hasAttribute("title")) { e.dataset.tip = e.getAttribute("title"); e.removeAttribute("title"); } return e.dataset.tip || ""; }
function tipLine(text, cls) {
  const d = el("div", cls);
  for (const part of text.split(/\b(UP|WARN|DOWN|STALE|UNKNOWN|IDLE)\b/)) {
    if (/^(UP|WARN|DOWN|STALE|UNKNOWN|IDLE)$/.test(part)) d.append(el("span", "s-" + part.toLowerCase(), part));
    else if (part) d.append(part);
  }
  return d;
}
function showTip(t, x, y, pin) {
  const text = tipOf(t);
  if (!text) return;
  tipFor = t; tipPinned = !!pin;
  const lines = text.split("\n").filter(l => l.trim());
  tipBox.replaceChildren(...lines.map((l, i) => tipLine(l, i ? "tl" : "tt")), el("div", "tp", "pinned · Escape or a click elsewhere closes it"));
  tipBox.classList.toggle("pinned", tipPinned);
  tipBox.hidden = false;
  const w = tipBox.offsetWidth, h = tipBox.offsetHeight, W = innerWidth, H = innerHeight;
  let left = x + 14, top = y + 16;
  if (left + w > W - 8) left = Math.max(8, x - w - 10);
  if (top + h > H - 8) top = Math.max(8, y - h - 12);
  tipBox.style.left = `${left}px`; tipBox.style.top = `${top}px`;
}
function hideTip() { clearTimeout(tipShow); clearTimeout(tipHide); tipBox.hidden = true; tipPinned = false; tipFor = null; }
document.addEventListener("mouseover", e => {
  if (tipBox.contains(e.target)) { clearTimeout(tipHide); return; }
  if (tipPinned) return;
  const t = tipTarget(e.target);
  if (!t) return;
  tipOf(t);                                   // the browser's own box never shows
  if (t === tipFor && !tipBox.hidden) { clearTimeout(tipHide); return; }
  clearTimeout(tipShow);
  const x = e.clientX, y = e.clientY;
  tipShow = setTimeout(() => showTip(t, x, y), tipBox.hidden ? 400 : 120);
});
document.addEventListener("mouseout", e => {
  if (tipPinned) return;
  const to = e.relatedTarget;
  if (to && (tipBox.contains(to) || (tipFor && tipFor.contains && tipFor.contains(to)))) return;
  clearTimeout(tipShow);
  if (!tipBox.hidden) { clearTimeout(tipHide); tipHide = setTimeout(hideTip, 250); }
});
tipBox.addEventListener("click", e => { e.stopPropagation(); tipPinned = true; tipBox.classList.add("pinned"); });
let tipPressed = false;                       // a long press: the click that ends it must not close what it opened
document.addEventListener("click", e => {
  if (tipPressed) { tipPressed = false; e.preventDefault(); e.stopPropagation(); return; }
  if (!tipBox.hidden && !tipBox.contains(e.target)) hideTip();
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !tipBox.hidden) { hideTip(); e.stopPropagation(); } }, true);
document.addEventListener("focusin", e => {
  const t = tipTarget(e.target);
  if (!t || tipPinned || e.target.matches(":not(:focus-visible)")) return;
  const r = t.getBoundingClientRect(); showTip(t, r.left, r.bottom);
});
document.addEventListener("focusout", () => { if (!tipPinned) hideTip(); });
document.addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch") return;
  const t = tipTarget(e.target);
  clearTimeout(tipPress);
  if (t) tipPress = setTimeout(() => { tipPressed = true; showTip(t, e.clientX, e.clientY, true); }, 550);
});
for (const ev of ["pointerup", "pointercancel", "pointermove"]) document.addEventListener(ev, () => clearTimeout(tipPress));
</script>
