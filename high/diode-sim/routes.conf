# DEV ONLY: diode-sim's routes, as the real diode's routes file: one room per line, then where its packets go:
# the receiver's container name and the port inside it (6510). MONITOR is the monitoring route (monitor-receiver).
# diode-sim reads this file again when it changes: adding a route needs no restart, other rooms keep flowing.
RELAY      signal-receiver-relay:6510
SELFTEST   signal-receiver-selftest:6510
DTT        signal-receiver-dtt:6510
MONITOR    signal-monitor-receiver:6511
