# LEFT side of the data diode: signal-cli and the subscriber. Copy this whole folder to the left host(s).
# The right side (receiver, playback) is a separate project in ../right. The only thing that goes from here
# to there is CEF over UDP, sent to UDP_DEST (in prod: the diode's input).
#
# signal-cli and the subscriber can run on one host or on two. Switch by commenting out (see README.md):
#   one host (as shipped):  both services, no `ports:` on signal, SIGNAL_URL=https://signal:8443
#   signal-cli host:        comment out `subscriber`; uncomment `ports:` on signal
#   subscriber host:        comment out `signal`; set SIGNAL_URL to the signal-cli host
# signal-cli <-> subscriber is always mutual TLS (certificates from ../image/tlscerts, in ./certs).
name: signal-left

# The user every container runs as. Prod: the operator's own account; put its numbers here (`id -u`, `id -g`).
# (Alternative: a system account, `sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin
# signal-relay`, then `id signal-relay`.) The account data, keys and logs must be owned by it: see README.md.
# Dev host: 1000 (tpham). Change the number here only.
x-relay-user: &relay-user "1000:1000"

services:
  # In-house signal-cli image (../image). Never run two signal-cli instances on the same account data:
  # they compete for messages and corrupt its sessions.
  signal:
    image: signal-cli:0.14.9
    container_name: signal-cli
    restart: unless-stopped
    init: true                  # lets stop signals reach java (the image has no shell)
    user: *relay-user
    read_only: true
    tmpfs:
      - /tmp:rw,exec,size=400m,mode=1777   # libsignal unpacks and loads itself from /tmp: needs exec
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 512
    environment:
      # What `docker logs signal-cli` shows for each received message:
      #   redacted  one plain-English line: kind, sender (number shortened), group, time; content hidden (default)
      #   full      signal-cli's normal output, INCLUDING message text (troubleshooting only)
      #   off       nothing
      # Change it, then: docker compose up -d --force-recreate signal  (this also clears the old log)
      - MESSAGE_LOG=redacted
      # TLS gateway (image/launcher/TlsGateway.java): TLS 1.3, only the subscriber's certificate, read-only allowlist
      # (message stream, health check, RPC listContacts). signal-cli's own unencrypted service stays on 127.0.0.1.
      - TLS_LISTEN=0.0.0.0:8443
      - TLS_CLIENT_NAMES=signal-subscriber,signal-monitor    # signal-monitor: health checks (its own certificate)
      - RPC_ALLOW=listContacts
    command: ["-a", "+19415499805", "daemon", "--http", "127.0.0.1:8080", "--receive-mode", "on-start",
              "--ignore-attachments", "--ignore-stories", "--ignore-avatars", "--ignore-stickers"]
    volumes:
      - ./signal-data:/data     # account keys: the only thing in this folder
      - ./certs/signal:/certs:ro
    # Subscriber on another host: uncomment to publish the TLS gateway ([ADDRESS:]PORT on this host).
    # Host port 8443 is taken by another app on the dev host. The unencrypted 8080 is never published.
    # ports:
    #   - "443:8443"

  # Reads the group's messages from signal-cli, splits them into CEF lines and sends them as UDP datagrams.
  # If signal-cli isn't up yet, it keeps retrying.
  subscriber:
    image: python:3.13-alp-u3
    container_name: signal-subscriber
    restart: unless-stopped
    user: *relay-user
    working_dir: /app
    command: ["python", "subscriber_udp.py"]
    environment:
      # GROUP: the groups this subscriber relays, one ID per line, each followed by a comma except the last.
      # Keep comments up here: a # inside the block below would become part of the value.
      #   zCV6AAXf…  Signal Relay
      #   tEDNlYXe…  (name not seen yet)
      #   KL+jHLGB…  (name not seen yet)
      #   3Rr5QB/j…  Signal-API-SelfTest
      #   vJ3tw/ZL…  (name not seen yet)
      - >-
        GROUP=zCV6AAXf4WH28L62kT/iMZ4m6Mrck6ZIwiJhHupA5Ck=,
        tEDNlYXeJoRmjW3Y+X1wUwlebcILZCimxr2jhfL8iM4=,
        KL+jHLGB57HarbxkluJFVrs8SYyAZHeqGNmy5ItTYjQ=,
        3Rr5QB/jXDXJ2XBmwu85/PBXcCueNoPIp/I0MxB4ARA=,
        vJ3tw/ZLyfK7iC9tIMzgCE5sWBb1xng0959dZU8BdYA=
      - SIGNAL_URL=https://signal:8443          # one host: the container
      # - SIGNAL_URL=https://ubt2:443           # subscriber host: a name in signal-cli's certificate, and its port
      - UDP_DEST=172.16.0.46                    # the diode's input (dev: this host, where ../right listens)
      - UDP_PORT=6510
      - STATE_FILE=/logs/signal-last-event-id   # where it stopped in the stream; copy it along when moving hosts
      - SENT_LOG=/logs/signal-udp-sent.jsonl
      - MONITOR_ADDR=signal-monitor:6520        # status every 10 s to this host's signal-monitor ("" = none)
      - RELAY_ID=relay-1                        # the signal-cli instance it reads (a name on the Monitor tab)
      - MONITOR_NAME=signal-subscriber          # this subscriber's name on the Monitor tab
    volumes:
      - ./subscriber/subscriber_udp.py:/app/subscriber_udp.py:ro
      - ./subscriber/comlibv3.py:/app/comlibv3.py:ro
      - ./logs:/logs
      - ./certs/subscriber:/certs:ro

  # Watches this host's part of the relay (signal-cli's health check, each subscriber's status, free disk) and
  # reports it across the diode on its own UDP port (6511), to monitor-receiver in ../right. One per left host.
  # Never sees message content. On a split setup, run it on the signal-cli host and point MONITOR_ADDR there.
  monitor:
    image: python:3.13-alp-u3
    container_name: signal-monitor
    restart: unless-stopped
    user: *relay-user
    working_dir: /app
    command: ["python", "signal_monitor.py"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    environment:
      - MONITOR_HOST=left-1                     # a name for this host on the Monitor tab
      - SIGNAL_TARGETS=relay-1=https://signal:8443   # instance=URL, comma-separated for several signal-cli
      - STATUS_PORT=6520                        # subscribers' status (this project's network only, not published)
      - UDP_DEST=172.16.0.46                    # the diode's input (dev: this host, where ../right listens)
      - UDP_PORT=6511                           # monitoring has its own port; chat stays on 6510
      - DISK_PATHS=/certs                       # free space of the disk holding left/ (logs, account data)
    volumes:
      - ./monitor/signal_monitor.py:/app/signal_monitor.py:ro
      - ./subscriber/comlibv3.py:/app/comlibv3.py:ro
      - ./certs/signal-monitor:/certs:ro        # make with: ../image/tlscerts client signal-monitor

  # A second subscriber for another group. Uncomment to use; add more the same way, each with its own
  # container_name, GROUP and STATE_FILE/SENT_LOG (sharing those files would mix up where each one stopped).
  # It shares the subscriber's certificate. Its messages go through the same diode, as a separate sender.
  # subscriber-2:
  #   image: python:3.13-alp-u3
  #   container_name: signal-subscriber-2
  #   restart: unless-stopped
  #   user: *relay-user
  #   working_dir: /app
  #   command: ["python", "subscriber_udp.py"]
  #   environment:
  #     - GROUP=3Rr5QB/jXDXJ2XBmwu85/PBXcCueNoPIp/I0MxB4ARA=   # "Signal-API-SelfTest"
  #     - SIGNAL_URL=https://signal:8443
  #     - UDP_DEST=172.16.0.46
  #     - UDP_PORT=6510
  #     - STATE_FILE=/logs/subscriber-2-last-event-id
  #     - SENT_LOG=/logs/subscriber-2-udp-sent.jsonl
  #   volumes:
  #     - ./subscriber/subscriber_udp.py:/app/subscriber_udp.py:ro
  #     - ./subscriber/comlibv3.py:/app/comlibv3.py:ro
  #     - ./logs:/logs
  #     - ./certs/subscriber:/certs:ro
